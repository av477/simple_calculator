name: Run Pytest

# Trigger the workflow on every push to the repository
on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code so the runner can access it
      - name: Check out repository
        uses: actions/checkout@v4

      # Step 2: Set up the Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13' # Replace with your preferred Python version

      # Step 3: Install dependencies (including pytest)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest  # Ensures pytest is available even if not in requirements.txt

      # Step 4: Run the test suite
      - name: Run tests with pytest
        run: python -m pytest
